name: Build and release Windows app

# - Push a tag like v1.2.0  → builds installer + portable on Windows, runs the tests,
#   and publishes a GitHub Release with the assets the in-app updater needs
#   (Setup exe, .blockmap, latest.yml, portable exe).
# - "Run workflow" (manual)  → builds and uploads the artifacts; with "publish" ticked it
#   also publishes the release for the version in package.json (useful when tags cannot
#   be pushed from the environment that made the commit).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (tag v<package.json version>) with the installer and latest.yml'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Releases go to this repository by default. To keep the source private while the
      # updater reads from a PUBLIC releases-only repository, set the repository variable
      # RELEASE_REPO (e.g. voiceforge-studio-releases) and the secret GH_RELEASE_TOKEN (a
      # fine-grained PAT with "Contents: write" on that repository).
      - name: Remove a half-published release with the same version (publish runs only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO || github.event.repository.name }}
          RELEASE_OWNER: ${{ github.repository_owner }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" --repo "$RELEASE_OWNER/$RELEASE_REPO" >/dev/null 2>&1; then
            ASSETS=$(gh release view "v$VERSION" --repo "$RELEASE_OWNER/$RELEASE_REPO" --json assets --jq '.assets[].name')
            if echo "$ASSETS" | grep -q '^latest.yml$'; then
              echo "Release v$VERSION is complete (latest.yml present); leaving it alone."
              echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
            else
              echo "Release v$VERSION exists without latest.yml — deleting it so it can be published cleanly."
              gh release delete "v$VERSION" --repo "$RELEASE_OWNER/$RELEASE_REPO" -y --cleanup-tag || true
            fi
          fi
      - name: Make sure the release tag exists (GitHub refuses a published release without one)
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && env.SKIP_PUBLISH != '1' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO || github.event.repository.name }}
          RELEASE_OWNER: ${{ github.repository_owner }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_OWNER/$RELEASE_REPO" = "$GITHUB_REPOSITORY" ]; then
            if ! git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
              git config user.name "github-actions" && git config user.email "actions@github.com"
              git tag -a "v$VERSION" -m "VoiceForge Studio $VERSION" "$GITHUB_SHA"
              git push origin "refs/tags/v$VERSION"
            fi
          else
            # Releases-only repository: tag its default branch head via the API.
            SHA=$(gh api "repos/$RELEASE_OWNER/$RELEASE_REPO/git/ref/heads/$(gh api repos/$RELEASE_OWNER/$RELEASE_REPO --jq .default_branch)" --jq .object.sha)
            gh api -X POST "repos/$RELEASE_OWNER/$RELEASE_REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$SHA" >/dev/null 2>&1 || true
          fi
      - name: Package (and publish on tag)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO || github.event.repository.name }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          PUBLISH: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'always' || 'never' }}
          DEBUG: electron-builder
        run: |
          set -o pipefail
          if [ "$SKIP_PUBLISH" = "1" ]; then PUBLISH=never; fi
          echo "publish=$PUBLISH owner=$RELEASE_OWNER repo=$RELEASE_REPO"
          STATUS=0
          npx electron-builder --win nsis portable --x64 --publish "$PUBLISH" \
               -c.publish.owner="$RELEASE_OWNER" -c.publish.repo="$RELEASE_REPO" 2>&1 | tee build.log || STATUS=$?
          { echo "### electron-builder exit $STATUS"; echo '```'; tail -n 150 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "BUILD_STATUS=$STATUS" >> "$GITHUB_ENV"
      - name: Save the build log to the ci-logs branch (readable without signing in)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f build.log ] || exit 0
          mkdir -p /tmp/cilogs && cd /tmp/cilogs
          git init -q && git config user.name "github-actions" && git config user.email "actions@github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin ci-logs 2>/dev/null && git checkout -q ci-logs || git checkout -q -b ci-logs
          cp "$GITHUB_WORKSPACE/build.log" "run-${GITHUB_RUN_ID}.log"
          git add . && git commit -q -m "Build log for run ${GITHUB_RUN_ID} (status ${BUILD_STATUS:-?})" && git push -q origin ci-logs
      - name: Fail the job if packaging failed
        if: ${{ env.BUILD_STATUS != '0' }}
        shell: bash
        run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceForge-Studio-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
